name: Docker Image

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version image tag to publish, for example v0.0.1"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wingsum93/badminton-website

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release image tag
        id: release_tag
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            image_tag="$INPUT_IMAGE_TAG"
          else
            package_version="$(node -p "require('./package.json').version")"
            image_tag="v${package_version}"
          fi

          if ! printf '%s\n' "$image_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "image_tag must match vMAJOR.MINOR.PATCH, for example v0.0.1" >&2
            exit 1
          fi

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker tags
        id: tags
        env:
          IMAGE_TAG: ${{ steps.release_tag.outputs.image_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA::7}"

          {
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:sha-${short_sha}"
            echo "${image}:${IMAGE_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
