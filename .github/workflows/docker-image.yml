name: Docker Image

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version image tag to publish, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wingsum93/badminton-website

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release image tag
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if ! printf '%s\n' "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "image_tag must match vMAJOR.MINOR.PATCH, for example v1.2.3" >&2
            exit 1
          fi

      - name: Prepare Docker tags
        id: tags
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA::7}"

          {
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:sha-${short_sha}"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "${image}:${IMAGE_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
