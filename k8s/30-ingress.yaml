apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: badminton-website
  namespace: badminton-website
  labels:
    app.kubernetes.io/name: badminton-website
    app.kubernetes.io/component: web
spec:
  ingressClassName: traefik
  rules:
    - host: badminton.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: badminton-website
                port:
                  name: http
