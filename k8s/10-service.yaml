apiVersion: v1
kind: Service
metadata:
  name: badminton-website
  namespace: badminton-website
  labels:
    app.kubernetes.io/name: badminton-website
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: badminton-website
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
