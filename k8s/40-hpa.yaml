apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: badminton-website
  namespace: badminton-website
  labels:
    app.kubernetes.io/name: badminton-website
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: badminton-website
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
