name: badminton-website

services:
  web:
    image: badminton-website:deploy
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BADMINTON_WEBSITE_PORT:-9413}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
